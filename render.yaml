services:
  - type: web
    name: stremio-titra-shqip-groq
    env: node
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: GROQ_MODEL
        value: llama-3.1-8b-instant
      - key: GROQ_API_KEYS
        sync: false
